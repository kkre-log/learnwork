<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MinGos Front</title>
</head>
<body>
  <div id="app">
    <button @click="loadFormats">Загрузить форматы</button>
    <div v-for="(d, i) in result?.data?.row" :key="i">
          <div>{{ d.formatCode }}</div>
          <div>{{ d.formatName }}</div>
    </div>
    <div v-if="error">
      {{ error }}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          apiBaseUrl: '',
          result: null,
          error: null
        }
      },
      async created() {
        try {
          const response = await fetch('config.json');
          const config = await response.json();
          this.apiBaseUrl = config.API_BASE_URL;
        } catch(err) {
          console.error('ошибка', err);
          this.error = err;
        }
      },
      methods: {
        async loadFormats() {
          try {
            const response = await fetch(this.apiBaseUrl + '/Processing/main', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json'},
              body: JSON.stringify({
                windowCode: '/Seminars/GetSeminarFormats',
                actionType: 'MONITOR',
                actionCode: 'default',
              })
            });
            if (response.ok) {
              this.result = await response.json();
            } else {
              throw new Error('Error');
            }
          } catch(err) {
            console.error('error', err);
            this.error = err.message;
          }
        }
      }
    })
  </script>
</body>
</html>
