<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MinGos Front</title>
</head>
<body>
  <div id="app">
    <button @click="loadProcessingMain('/Seminars/GetSeminarFormats', 'MONITOR', 'default')">Загрузить форматы</button>
    <button @click="loadProcessingMain('/Nothing', 'MONITOR', 'default')">Загрузить ничего</button>
    <div v-if="loading">
      Идет загрузка
    </div>
    <div v-for="(d, i) in result?.data?.row" :key="i">
          <div>{{ d.formatCode }}</div>
          <div>{{ d.formatName }}</div>
    </div>
    <div v-if="error">
      {{ error }}
    </div>

    <mini-form window-code="/Seminars/GetSeminarFormats" action-type="MONITOR" action-code="default">
      <template #default="{ result, error, loading }">
        <div>loading {{ loading }}</div>
        <div>error {{ error }}</div>
        <div>result {{ result }}</div>
      </template>
    </mini-form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
  <script>

    Vue.component('mini-form', {
      props: {
        windowCode: String,
        actionCode: String,
        actionType: String,
        autoLoad: { type: Boolean, default: true },
      },
      data() {
        return {
          result: null,
          error: null,
          loading: false,
        }
      },
      template: `
        <div>
          <slot :result="result" :error="error" :loading="loading"></slot>
        </div>
      `
    })

    new Vue({
      el: '#app',
      data() {
        return {
          apiBaseUrl: '',
          result: null,
          error: null,
          loading: false,
        }
      },
      async created() {
        try {
          const response = await fetch('config.json');
          const config = await response.json();
          this.apiBaseUrl = config.API_BASE_URL;
        } catch(err) {
          console.error('ошибка', err);
          this.error = err;
        }
      },
      methods: {
        async loadProcessingMain(windowCode, actionType, actionCode) {
           try {
            this.error = null;
            this.result = null;
            this.loading = true;

            this.result = await this.sendProcessing(windowCode, actionType, actionCode);
          } catch(err) {
            console.error('error', err);
            this.error = err.message;
          } finally {
            this.loading = false;
          }
        },

        async sendProcessing(windowCode, actionType, actionCode) {
          const response = await fetch(this.apiBaseUrl + '/Processing/main', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json'
             },
            body: JSON.stringify({
              windowCode,
              actionType,
              actionCode,
            })
          });
  
          if (response.ok) {
            return response.json()
          } else {
            throw new Error(`Сервер ответил: ${response.status}`);
          }
        }
      },

    })
  </script>
</body>
</html>
